<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Frame bg (canon dark panel) -->
  <rect x="2" y="2" width="60" height="60" rx="6" fill="#18181F" stroke="#3A3A42" stroke-width="2"/>

  <!-- Shock lines radiales rojas (impacto desde el puño, detrás) -->
  <g stroke="#E04828" stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="52" y1="20" x2="58" y2="16"/>
    <line x1="54" y1="32" x2="60" y2="32"/>
    <line x1="52" y1="44" x2="58" y2="48"/>
    <line x1="44" y1="14" x2="48" y2="8"/>
    <line x1="44" y1="50" x2="48" y2="56"/>
  </g>

  <!-- Puño (silueta acero) perfil mirando hacia la derecha -->
  <!-- Antebrazo / muñeca -->
  <rect x="8" y="26" width="20" height="14" rx="2" fill="#7A7A82" stroke="#2A2A30" stroke-width="1.5"/>

  <!-- Guantelete dorado (banda muñeca) -->
  <rect x="24" y="24" width="6" height="18" rx="1" fill="#D4A040" stroke="#8A5A18" stroke-width="1"/>

  <!-- Palma/dorso del puño -->
  <path d="M30 22
           L44 22
           Q50 22 50 28
           L50 38
           Q50 44 44 44
           L30 44 Z"
        fill="#7A7A82"
        stroke="#2A2A30"
        stroke-width="1.5"/>

  <!-- Nudillos (4 cuadrados dorado en el frente) -->
  <rect x="44" y="25" width="4" height="3.5" rx="0.5" fill="#D4A040" stroke="#8A5A18" stroke-width="0.8"/>
  <rect x="44" y="30" width="4" height="3.5" rx="0.5" fill="#D4A040" stroke="#8A5A18" stroke-width="0.8"/>
  <rect x="44" y="35" width="4" height="3.5" rx="0.5" fill="#D4A040" stroke="#8A5A18" stroke-width="0.8"/>
  <rect x="44" y="40" width="4" height="3.5" rx="0.5" fill="#D4A040" stroke="#8A5A18" stroke-width="0.8"/>

  <!-- Highlight metálico antebrazo -->
  <rect x="10" y="28" width="16" height="3" rx="1" fill="#A0A0A8" opacity="0.6"/>
</svg>
