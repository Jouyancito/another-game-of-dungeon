<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Frame bg -->
  <rect x="2" y="2" width="60" height="60" rx="6" fill="#18181F" stroke="#3A3A42" stroke-width="2"/>

  <!-- Chispa parry — líneas blancas radiales desde el punto de bloqueo -->
  <g stroke="#FFF4C0" stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="40" y1="24" x2="56" y2="12"/>
    <line x1="46" y1="28" x2="60" y2="26"/>
    <line x1="48" y1="34" x2="62" y2="38"/>
    <line x1="44" y1="40" x2="56" y2="52"/>
    <line x1="38" y1="20" x2="48" y2="8"/>
  </g>

  <!-- Chispas secundarias más finas (dorado) -->
  <g stroke="#FFD560" stroke-width="1.3" stroke-linecap="round" fill="none">
    <line x1="42" y1="22" x2="52" y2="16"/>
    <line x1="47" y1="32" x2="57" y2="32"/>
    <line x1="42" y1="42" x2="52" y2="48"/>
  </g>

  <!-- Escudo parry (más pequeño que shield_bash para diferenciar, kite shape, lado izquierdo) -->
  <path d="M22 14
           L40 20
           L40 36
           Q40 46 26 52
           Q12 46 12 36
           L12 18 Z"
        fill="#7A7A82"
        stroke="#D4A040"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Highlight metálico escudo -->
  <path d="M22 18
           L35 22
           L35 32
           Q35 38 28 44
           L24 42 Z"
        fill="#A0A0A8"
        opacity="0.65"/>

  <!-- Flash central blanco en el punto de impacto (borde derecho escudo) -->
  <circle cx="42" cy="30" r="4" fill="#FFF4C0" opacity="0.9"/>
  <circle cx="42" cy="30" r="2" fill="#FFFFFF"/>

  <!-- Boss escudo (remache dorado central) -->
  <circle cx="26" cy="30" r="3" fill="#D4A040" stroke="#8A5A18" stroke-width="0.9"/>
</svg>
