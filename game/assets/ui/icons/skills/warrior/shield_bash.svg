<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background dark rounded square (consistent with placeholder frame) -->
  <rect x="2" y="2" width="60" height="60" rx="6" fill="#18181F" stroke="#3A3A42" stroke-width="2"/>

  <!-- Shock lines radiales (rojo Rage, detrás del escudo, feel "impacto") -->
  <g stroke="#E04828" stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="32" y1="8" x2="32" y2="14"/>
    <line x1="48" y1="12" x2="44" y2="17"/>
    <line x1="56" y1="24" x2="50" y2="26"/>
    <line x1="56" y1="44" x2="50" y2="42"/>
    <line x1="48" y1="56" x2="44" y2="51"/>
    <line x1="16" y1="12" x2="20" y2="17"/>
    <line x1="8" y1="24" x2="14" y2="26"/>
    <line x1="8" y1="44" x2="14" y2="42"/>
    <line x1="16" y1="56" x2="20" y2="51"/>
  </g>

  <!-- Escudo heater shape (acero gris con borde dorado) -->
  <path d="M32 14
           L50 20
           L50 34
           Q50 46 32 54
           Q14 46 14 34
           L14 20 Z"
        fill="#7A7A82"
        stroke="#D4A040"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Highlight claro en el escudo (reflejo metálico) -->
  <path d="M32 18
           L44 22
           L44 33
           Q44 40 36 46
           L32 44 Z"
        fill="#A0A0A8"
        opacity="0.7"/>

  <!-- Banda horizontal dorada central (detalle escudo) -->
  <path d="M14 30 L50 30 L50 34 L14 34 Z"
        fill="#D4A040"
        opacity="0.85"/>

  <!-- Boss central dorado (remache/central boss del escudo) -->
  <circle cx="32" cy="32" r="4.5" fill="#D4A040" stroke="#8A5A18" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="2" fill="#8A5A18"/>
</svg>
