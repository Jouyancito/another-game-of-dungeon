<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Frame bg -->
  <rect x="2" y="2" width="60" height="60" rx="6" fill="#18181F" stroke="#3A3A42" stroke-width="2"/>

  <!-- Gradientes para el núcleo estelar y el blast radial -->
  <defs>
    <radialGradient id="novaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FFE499" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#FF8C30" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6E3FA8" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="novaHalo" cx="50%" cy="50%" r="55%">
      <stop offset="40%" stop-color="#6E3FA8" stop-opacity="0"/>
      <stop offset="75%" stop-color="#8A5FC8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6E3FA8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo arcano violeta (outer glow, feel ULTIMATE — más cargado que otros iconos) -->
  <circle cx="32" cy="32" r="28" fill="url(#novaHalo)"/>

  <!-- Rayos radiales LARGOS (8 direcciones, blanco+dorado — estrella explotando) -->
  <g stroke="#FFE499" stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="32" y1="4"  x2="32" y2="18"/>
    <line x1="32" y1="46" x2="32" y2="60"/>
    <line x1="4"  y1="32" x2="18" y2="32"/>
    <line x1="46" y1="32" x2="60" y2="32"/>
  </g>
  <g stroke="#FF8C30" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="12" y1="12" x2="22" y2="22"/>
    <line x1="52" y1="12" x2="42" y2="22"/>
    <line x1="12" y1="52" x2="22" y2="42"/>
    <line x1="52" y1="52" x2="42" y2="42"/>
  </g>

  <!-- Rayos intermedios finos blancos (entre los 8 principales — total 16 puntas) -->
  <g stroke="#F0ECD8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.75">
    <line x1="22" y1="8"  x2="26" y2="20"/>
    <line x1="42" y1="8"  x2="38" y2="20"/>
    <line x1="22" y1="56" x2="26" y2="44"/>
    <line x1="42" y1="56" x2="38" y2="44"/>
    <line x1="8"  y1="22" x2="20" y2="26"/>
    <line x1="56" y1="22" x2="44" y2="26"/>
    <line x1="8"  y1="42" x2="20" y2="38"/>
    <line x1="56" y1="42" x2="44" y2="38"/>
  </g>

  <!-- Blast radial concéntrico exterior (violeta — confirma paleta Mage, el contexto arcano) -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#8A5FC8" stroke-width="1.5" opacity="0.65"/>

  <!-- Estrella central 4 puntas (silueta principal, dorado+blanco) -->
  <path d="M 32 14
           L 35 30
           L 50 32
           L 35 34
           L 32 50
           L 29 34
           L 14 32
           L 29 30 Z"
        fill="#FFE499"
        stroke="#FF8C30"
        stroke-width="1.2"/>

  <!-- Núcleo estrella — glow blanco caliente (gradient radial) -->
  <circle cx="32" cy="32" r="8" fill="url(#novaCore)"/>

  <!-- Highlight central pequeño (puro blanco — "punto brillante") -->
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF"/>
</svg>
