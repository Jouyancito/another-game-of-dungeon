<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Frame bg -->
  <rect x="2" y="2" width="60" height="60" rx="6" fill="#18181F" stroke="#3A3A42" stroke-width="2"/>

  <!-- Radial glow detrás del orbe (halo arcano tenue) -->
  <defs>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B890FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6E3FA8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="34" r="22" fill="url(#orbGlow)"/>

  <!-- Bolita ASIMÉTRICA (no circle perfecto — "inestable") -->
  <path d="M 32 20
           Q 44 22 46 32
           Q 48 44 36 48
           Q 22 50 18 38
           Q 16 24 32 20 Z"
        fill="#6E3FA8"
        stroke="#3E78B8"
        stroke-width="2"/>

  <!-- Highlight interior (reflejo arcano) -->
  <path d="M 26 24
           Q 36 22 40 28
           Q 34 26 28 30 Z"
        fill="#B890FF"
        opacity="0.75"/>

  <!-- Núcleo cyan inestable (centro pulsante) -->
  <circle cx="32" cy="34" r="4" fill="#5EBFE8"/>
  <circle cx="32" cy="34" r="1.8" fill="#F0ECD8"/>

  <!-- Chispas erráticas alrededor (6 líneas radiales pero NO simétricas — ángulos irregulares) -->
  <g stroke="#F0ECD8" stroke-width="1.8" stroke-linecap="round" fill="none">
    <line x1="48" y1="12" x2="52" y2="8"/>
    <line x1="14" y1="10" x2="10" y2="6"/>
    <line x1="54" y1="28" x2="60" y2="30"/>
    <line x1="8"  y1="42" x2="4"  y2="46"/>
    <line x1="46" y1="54" x2="50" y2="58"/>
  </g>

  <!-- Chispas secundarias cyan (más pequeñas) -->
  <g stroke="#5EBFE8" stroke-width="1.2" stroke-linecap="round" fill="none">
    <line x1="16" y1="52" x2="12" y2="56"/>
    <line x1="54" y1="44" x2="58" y2="42"/>
  </g>
</svg>
