<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Frame bg -->
  <rect x="2" y="2" width="60" height="60" rx="6" fill="#18181F" stroke="#3A3A42" stroke-width="2"/>

  <!-- Glow detrás (rastro del dash) -->
  <defs>
    <linearGradient id="dashGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A0F2E" stop-opacity="0"/>
      <stop offset="60%" stop-color="#6E3FA8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B890FF" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="52" height="52" rx="4" fill="url(#dashGlow)"/>

  <!-- Clon decoy en el origen (izq-abajo) — silueta difuminada -->
  <g opacity="0.4">
    <!-- cabeza clon -->
    <circle cx="16" cy="36" r="3.5" fill="#6E3FA8"/>
    <!-- torso clon -->
    <path d="M 13 40 L 19 40 L 20 52 L 12 52 Z" fill="#6E3FA8"/>
    <!-- partículas disolventes -->
    <circle cx="10" cy="48" r="1.2" fill="#8A5FCB"/>
    <circle cx="22" cy="46" r="0.9" fill="#8A5FCB"/>
    <circle cx="14" cy="56" r="0.8" fill="#4A1F6E"/>
  </g>

  <!-- Afterimage intermedio (centro) — menos opaco, trail del dash -->
  <g opacity="0.55">
    <circle cx="32" cy="28" r="3" fill="#8A5FCB"/>
    <path d="M 30 31 L 34 31 L 34 42 L 30 42 Z" fill="#8A5FCB"/>
  </g>

  <!-- Danzante real en destino (arriba-derecha) — full opacity -->
  <!-- Cabeza -->
  <circle cx="48" cy="20" r="4" fill="#B890FF" stroke="#F0ECD8" stroke-width="1"/>
  <!-- Torso con capa flotante -->
  <path d="M 45 24 L 51 24 L 53 36 L 43 36 Z"
        fill="#4A1F6E"
        stroke="#B890FF"
        stroke-width="1"/>
  <!-- Capa trailing (indicador de velocidad) -->
  <path d="M 43 30 L 38 32 L 36 28 L 43 26 Z"
        fill="#1A0F2E"
        opacity="0.8"/>

  <!-- Flecha de dirección del dash (trail violeta) -->
  <path d="M 12 54 Q 28 40 46 22"
        stroke="#B890FF"
        stroke-width="2"
        stroke-dasharray="2,3"
        stroke-linecap="round"
        fill="none"
        opacity="0.7"/>

  <!-- Chispa de aparición -->
  <g stroke="#F0ECD8" stroke-width="1.2" stroke-linecap="round">
    <line x1="52" y1="16" x2="56" y2="12"/>
    <line x1="44" y1="14" x2="42" y2="10"/>
    <line x1="56" y1="24" x2="60" y2="22"/>
  </g>
</svg>
