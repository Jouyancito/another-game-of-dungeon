<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slime — animation set</title>
<style>
  body { background: #1e1a2e; color: #e8e4f0; font-family: system-ui, sans-serif;
         margin: 0; padding: 24px; }
  h1 { font-weight: 600; font-size: 20px; margin: 0 0 16px; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  figure { margin: 0; text-align: center; }
  img { width: 300px; border-radius: 8px; display: block; }
  figcaption { padding: 8px 0 0; font-size: 14px; color: #b8b0d0; }
  .tag { color: #7ee787; font-family: monospace; }
</style>
</head>
<body>
<h1>Slime — animation set (2026-07-18)</h1>
<div class="grid">
  <figure><img src="slime_idle.gif" alt="idle"><figcaption><span class="tag">idle-loop</span> — respiración viscosa</figcaption></figure>
  <figure><img src="slime_hop.gif" alt="hop"><figcaption><span class="tag">hop-loop</span> — salto (locomoción)</figcaption></figure>
  <figure><img src="slime_attack.gif" alt="attack"><figcaption><span class="tag">attack</span> — embestida</figcaption></figure>
  <figure><img src="slime_hit.gif" alt="hit"><figcaption><span class="tag">hit</span> — reacción al golpe</figcaption></figure>
  <figure><img src="slime_death.gif" alt="death"><figcaption><span class="tag">death</span> — se derrite</figcaption></figure>
</div>
<div class="grid" style="margin-top:24px">
  <figure><img src="slime_green.png" alt="green"><figcaption>pradera</figcaption></figure>
  <figure><img src="slime_blue.png" alt="blue"><figcaption>agua</figcaption></figure>
  <figure><img src="slime_brown.png" alt="brown"><figcaption>tierra</figcaption></figure>
</div>
</body>
</html>
