# DRAFT — ruff config snippet for DungeonParty-A. NOT APPLIED.
# Splice these tables into the repo-root `pyproject.toml` during rollout step 3
# (see ../code-quality-proposal.md §6). If no root pyproject.toml exists yet,
# this file's contents can become `ruff.toml` at the root instead (drop the
# `[tool.ruff]` -> `` prefix: `[tool.ruff.lint]` becomes `[lint]`, etc.).
#
# Scope: the 9 headless-Blender scripts under game/tools/blender/*.py.
# game/tools/godot/ has ZERO .py files (it's .gd + PNG anim-capture artifacts).

[tool.ruff]
line-length = 120                       # generators carry long geometry literals
target-version = "py311"                # match Blender's bundled CPython
extend-include = ["game/tools/blender/*.py"]

[tool.ruff.lint]
# E/F  = pycodestyle + pyflakes (core correctness)
# I    = isort (import ordering — normalizes the combined-import scripts)
# UP   = pyupgrade (modern syntax)
# B    = flake8-bugbear (likely-bug patterns)
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]                        # long lines = geometry data, not worth wrapping

# Deliberately NOT enabled:
#   D    (docstrings)   — 8/9 files already have module docstrings; not enforcing per-fn
#   ANN  (annotations)  — procedural throwaway scripts, hints are optional here
#   PLR  (complexity)   — long linear build functions are fine for asset generators
#   T201 (print)        — print() IS the intended output channel of these scripts

# bpy / bmesh / mathutils are runtime-injected by Blender and are NOT pip-installable.
# ruff is static (never executes) so it won't raise unresolved-import errors;
# any CI must run ruff WITHOUT trying to import these modules.
